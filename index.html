<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="2FIT"><meta name="theme-color" content="#163b52"><title>2FIT / 2FOCUSED</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#142b3a;background:#f3f6f8}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{background:#163b52;color:white;padding:24px 18px 20px}header h1{font-size:25px;margin:0 0 5px}header p{margin:0;opacity:.85}main{max-width:700px;margin:auto;padding:16px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.days button{padding:13px 0;border:0;border-radius:12px;background:#dce6eb;font-weight:700;color:#163b52;font-size:15px}.days button.active{background:#176e87;color:white}.card{background:white;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 12px #18354b12}h2{font-size:20px;margin:0 0 8px}.muted{color:#607584;font-size:14px}.exercise{border-top:1px solid #e3e9ed;padding:15px 0}.exercise:first-of-type{border-top:0}.exhead{display:flex;gap:10px;align-items:start}.exhead input{width:24px;height:24px;accent-color:#167e77;flex-shrink:0}.exhead strong{font-size:17px}.target{font-size:14px;color:#587080;margin:5px 0 10px 34px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-left:34px}label{font-size:13px;color:#526879}input[type=number],input[type=date],textarea{width:100%;border:1px solid #cad8e0;border-radius:9px;padding:11px;font:inherit;background:#fff;color:#152c3a}textarea{min-height:72px}.actions{display:flex;gap:9px;flex-wrap:wrap}button.action{border:0;border-radius:10px;padding:13px 16px;background:#176e87;color:white;font-weight:700;font-size:15px}button.secondary{background:#e2eaf0;color:#163b52}.status{font-size:14px;color:#16745e;margin-top:10px}.history-item{border-top:1px solid #e1e7ea;padding:10px 0;font-size:14px}.footer{color:#647885;text-align:center;font-size:12px;margin:22px 0}.set-list{margin-top:9px}.set-row{display:grid;grid-template-columns:58px 30px minmax(0,1fr) minmax(0,1fr);align-items:center;gap:8px;margin:7px 0}.set-row span{font-size:13px;font-weight:650}.set-row input[type=checkbox]{width:23px;height:23px;accent-color:#167e77}.set-row input[type=number],.set-row input[type=text]{min-width:0;width:100%;border:1px solid #cad8e0;border-radius:9px;padding:10px 6px;font-size:16px}.set-hint{font-size:12px;color:#607584;margin:8px 0}.prior{font-size:12px;color:#176e87;margin:5px 0 8px 0}.cardio{background:#edf7fa;border-radius:12px;padding:13px;margin:12px 0}.cardio-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.cardio-grid label{display:block}.cardio-grid input{margin-top:5px}.cardio-title{font-weight:750;font-size:18px}.cardio input[type=checkbox]{width:22px;height:22px;vertical-align:middle;accent-color:#167e77} .routine{background:#f0f8f4;border-radius:12px;padding:13px;margin:12px 0}.routine h3{margin:0 0 7px;font-size:18px}.routine-row{display:grid;grid-template-columns:25px 1fr 95px;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #dce9e1}.routine-row:last-child{border-bottom:0}.routine-row input[type=checkbox]{width:22px;height:22px;accent-color:#167e77}.routine-row input[type=number]{padding:8px}.timer-display{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;margin:8px 0}.timer-buttons{display:flex;gap:8px;flex-wrap:wrap}.timer-buttons button{border:0;border-radius:9px;padding:10px 13px;font-size:15px;font-weight:700;background:#176e87;color:white}.timer-buttons button.secondary{background:#dce6eb;color:#163b52}.timer-active{font-weight:700;color:#126b65} </style></head><body><header><h1>2FIT / 2FOCUSED</h1><p>5-Day Strength + 20-Minute Cardio Tracker</p></header><main><div class="days" id="days"></div><section class="card"><h2 id="dayTitle"></h2><div class="muted">Workout date</div><input type="date" id="date" style="margin:8px 0 10px"><div class="set-hint">Cardio each day, plus individual strength sets. Previous performance appears under each set.</div><div id="warmup"></div><div id="core"></div><div id="exercises"></div><div id="cardio"></div><label for="notes">Workout notes</label><textarea id="notes" placeholder="How did you feel today?"></textarea><div class="actions" style="margin-top:14px"><button class="action" id="save">Save workout</button><button class="action secondary" id="clear">Clear this day</button></div><div class="status" id="status" aria-live="polite"></div></section><section class="card"><h2>Workout history</h2><div class="actions"><button class="action secondary" id="export">Export backup (CSV)</button></div><div id="history" class="muted" style="margin-top:12px"></div></section><div class="footer">Records stay in this browser on this device. Export backups regularly.</div></main><script>
const workouts=[{name:'Upper Body Strength',items:[['Machine chest press','3 × 10–12'],['Seated cable row','3 × 10–12'],['Lat pulldown','2 × 10–12'],['Seated dumbbell shoulder press','2 × 10 · if pain-free'],['Dumbbell biceps curls','2 × 12'],['Cable triceps pushdowns','2 × 12']]},{name:'Lower Body + Balance',items:[['Sit-to-stand from bench','3 × 8–12'],['Leg press','2 × 10–12'],['Seated hamstring curl','3 × 12'],['Supported calf raises','2 × 12–15'],['Supported standing hip abductions','2 × 10 per side'],['Controlled weight shifts','2 × 10']]},{name:'Functional Fitness + Mobility',items:[['Comfortable treadmill or outdoor walk','25–35 minutes'],['Standing marches while holding support','2 × 10 per side'],['Incline push-ups against a stable bench','2 × 10'],['Heavy farmer carries','3 × 60 feet'],['Gentle hip, ankle, and thoracic mobility','5–8 minutes']]},{name:'Upper Body + Posture',items:[['Incline machine chest press','2 × 10–12'],['Chest-supported row','3 × 10–12'],['Lat pulldown','2 × 12'],['Light dumbbell lateral raises','2 × 12'],['Biceps curls','2 × 12'],['Face pulls','2 × 12'],['Standing balance with support nearby','3 × 20 seconds']]},{name:'Full-Body Functional Strength',items:[['Sit-to-stand','2 × 10'],['Dumbbell deadlift from elevated blocks','2 × 8–10 · only if technique and mobility allow'],['Machine chest press','2 × 12'],['Seated cable row','2 × 12'],['Supported calf raises','2 × 15'],['Light farmer carries','3 × 20–30 feet'],['Easy cooldown walk','5 minutes']]}];
const cardioPlan=[{machine:'Precor elliptical',detail:'20 min · 5 easy + 12 comfortable/moderate + 3 easy',fields:['Resistance level','Distance (mi)','Average HR (bpm)']},{machine:'Treadmill',detail:'20 min · 5 easy + 12 brisk comfortable walk + 3 easy',fields:['Speed (mph)','Incline (%)','Distance (mi)']},{machine:'Rowing machine',detail:'20 min · 5 easy + 12 steady rowing + 3 easy',fields:['Distance (m)','Average stroke rate','Average HR (bpm)']},{machine:'Stair stepper',detail:'20 min · 5 easy + 12 steady climb + 3 easy',fields:['Level','Floors / steps','Average HR (bpm)']},{machine:'Precor elliptical or treadmill',detail:'20 min · easy recovery effort; choose whichever feels best',fields:['Machine used','Level / speed','Distance'] }];
const warmups=['Lymphatic hops','Body waves','Trunk twists','Arm swings','Dead arm swings','Golf swings','Marches','Ballet squats','Horse stance'];const cores=[['Bicycles',50,'reps'],['Suitcases',30,'reps'],['Russian twists',30,'reps'],['Isometric hold',30,'sec'],['Shoulder taps',30,'reps'],['Plank',30,'sec']];let timerIndex=0,timerRemaining=60,timerRunning=false,timerHandle=null,timerEnd=0,audioContext=null;const key='2fit_workouts_v2', oldKey='2fit_workouts_v1';let db={};try{db=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let current=0;const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('date').value=today();function recordKey(){return $('date').value+'|'+current}function setCount(target){let m=target.match(/^(\d+)\s*×/);return m?Number(m[1]):1}function priorSet(name,j){let prior=null;for(const r of Object.values(db)){if(!r.date||r.date >= $('date').value)continue;const day=workouts[r.day];if(!day)continue;const i=day.items.findIndex(x=>x[0]===name);if(i<0)continue;const v=r.entries?.[i]?.sets?.[j];if(!v||(!v.weight&&!v.actual))continue;if(!prior||r.date>prior.date)prior={date:r.date,...v}}return prior}
function beep(){try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=880;g.gain.setValueAtTime(.15,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.2);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.2)}catch(e){}}
function stopTimer(){timerRunning=false;if(timerHandle)clearInterval(timerHandle);timerHandle=null}
function updateTimer(){const t=$('timerClock'),n=$('timerMovement');if(!t||!n)return;t.textContent=String(Math.floor(timerRemaining/60)).padStart(2,'0')+':'+String(timerRemaining%60).padStart(2,'0');n.textContent=timerIndex>=warmups.length?'Warm-up complete!':(timerIndex+1)+' / 9 — '+warmups[timerIndex];$('timerStart').textContent=timerRunning?'Pause':timerIndex>=9?'Restart':'Start';document.querySelectorAll('[data-warm-name]').forEach((e,i)=>{e.classList.toggle('timer-active',i===timerIndex&&timerIndex<9)})}
function timerTick(){let remaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(remaining===0){beep();const check=document.querySelector('[data-warm-check="'+timerIndex+'"]');if(check)check.checked=true;timerIndex++;if(timerIndex>=warmups.length){stopTimer();timerRemaining=0;updateTimer();return}timerEnd+=60000;remaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000))}timerRemaining=remaining;updateTimer()}
function renderWarmup(saved){stopTimer();timerIndex=0;timerRemaining=60;const root=$('warmup');root.replaceChildren();const section=document.createElement('section');section.className='routine';section.innerHTML='<h3>Daily 9-Movement Warm-Up · 9 minutes</h3><div id="timerMovement" class="timer-active"></div><div id="timerClock" class="timer-display" aria-live="off">01:00</div><div class="timer-buttons"><button id="timerStart" type="button">Start</button><button id="timerNext" type="button" class="secondary">Skip</button><button id="timerReset" type="button" class="secondary">Reset</button></div><div id="warmRows"></div>';root.append(section);const rows=section.querySelector('#warmRows');warmups.forEach((name,i)=>{const row=document.createElement('div');row.className='routine-row';const ck=document.createElement('input');ck.type='checkbox';ck.dataset.warmCheck=i;ck.checked=!!saved.warmup?.[i];ck.setAttribute('aria-label',name+' completed');const label=document.createElement('span');label.dataset.warmName=i;label.textContent=name;const duration=document.createElement('span');duration.className='muted';duration.textContent='60 sec';row.append(ck,label,duration);rows.append(row)});$('timerStart').onclick=()=>{if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));stopTimer()}else{if(timerIndex>=9){timerIndex=0;timerRemaining=60}try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();audioContext.resume()}catch(e){}timerRunning=true;timerEnd=Date.now()+timerRemaining*1000;timerHandle=setInterval(timerTick,200)}updateTimer()};$('timerNext').onclick=()=>{beep();if(timerIndex<9){document.querySelector('[data-warm-check="'+timerIndex+'"]').checked=true;timerIndex++}timerRemaining=timerIndex>=9?0:60;if(timerIndex>=9)stopTimer();else if(timerRunning)timerEnd=Date.now()+60000;updateTimer()};$('timerReset').onclick=()=>{stopTimer();timerIndex=0;timerRemaining=60;updateTimer()};updateTimer()}
function plankTarget(){const start=new Date('2026-11-01T12:00:00');const selected=new Date($('date').value+'T12:00:00');const weeks=Math.max(0,Math.floor((selected-start)/604800000));return 30+30*weeks}function renderCore(saved){const root=$('core');root.replaceChildren();const section=document.createElement('section');section.className='routine';const heading=document.createElement('h3');heading.textContent='Daily Core Exercises';section.append(heading);cores.forEach(([name,target,unit],i)=>{const row=document.createElement('div');row.className='routine-row';const ck=document.createElement('input');ck.type='checkbox';ck.dataset.coreCheck=i;ck.checked=!!saved.core?.[i]?.done;ck.setAttribute('aria-label',name+' completed');const label=document.createElement('span');const goal=name==='Plank'?plankTarget():target;label.textContent=name+' · '+goal+' '+unit+(name==='Plank'?' (adds 30 sec/week)':'');const inp=document.createElement('input');inp.type='number';inp.min='0';inp.step='1';inp.inputMode='numeric';inp.dataset.coreActual=i;inp.placeholder=unit;inp.value=saved.core?.[i]?.actual??'';inp.setAttribute('aria-label',name+' actual '+unit);row.append(ck,label,inp);section.append(row)});root.append(section)}
function renderCardio(saved){const c=cardioPlan[current],v=saved.cardio||{};const root=$('cardio');root.replaceChildren();const panel=document.createElement('div');panel.className='cardio';const heading=document.createElement('div');heading.className='cardio-title';heading.textContent='20-Minute Cardio — '+c.machine;const detail=document.createElement('div');detail.className='muted';detail.textContent=c.detail;const complete=document.createElement('label');complete.style='display:block;margin-top:10px';const ck=document.createElement('input');ck.type='checkbox';ck.id='cardioDone';ck.checked=!!v.done;complete.append(ck,document.createTextNode(' Completed'));const grid=document.createElement('div');grid.className='cardio-grid';[['Minutes completed','minutes'],...c.fields.map((f,i)=>[f,'field'+i])].forEach(([label,key])=>{const wrap=document.createElement('label');wrap.textContent=label;const inp=document.createElement('input');inp.type='text';inp.dataset.cardio=key;inp.value=v[key]??(key==='minutes'?'20':'');inp.placeholder=key==='minutes'?'20':'Optional';wrap.append(inp);grid.append(wrap)});panel.append(heading,detail,complete,grid);root.append(panel)}
function render(){const d=workouts[current],saved=db[recordKey()]||{};$('days').innerHTML=workouts.map((_,i)=>`<button type="button" class="${i===current?'active':''}" data-day="${i}">Day ${i+1}</button>`).join('');$('dayTitle').textContent=`Day ${current+1} — ${d.name}`;$('exercises').replaceChildren();renderWarmup(saved);renderCore(saved);renderCardio(saved);d.items.forEach(([name,target],i)=>{let entry=(saved.entries||[])[i]||{},count=setCount(target);let wrap=document.createElement('div');wrap.className='exercise';let head=document.createElement('div');head.className='exhead';let title=document.createElement('strong');title.textContent=name;head.append(title);let sub=document.createElement('div');sub.className='target';sub.textContent='Target: '+target;let sets=document.createElement('div');sets.className='set-list';for(let j=0;j<count;j++){let v=(entry.sets||[])[j]||{};let line=document.createElement('div');line.className='set-row';let lab=document.createElement('span');lab.textContent=count===1?'Session':`Set ${j+1}`;let check=document.createElement('input');check.type='checkbox';check.checked=!!v.done;check.dataset.i=i;check.dataset.j=j;check.className='set-done';check.setAttribute('aria-label',`${name} set ${j+1} completed`);let weight=document.createElement('input');weight.type='number';weight.min='0';weight.step='any';weight.inputMode='decimal';weight.placeholder='lb';weight.value=v.weight??'';weight.dataset.i=i;weight.dataset.j=j;weight.dataset.field='weight';weight.setAttribute('aria-label',`${name} set ${j+1} weight in pounds`);let actual=document.createElement('input');actual.type='text';actual.placeholder=target.includes('minute')?'min':target.includes('feet')?'feet':target.includes('seconds')?'sec':'reps';actual.value=v.actual??'';actual.dataset.i=i;actual.dataset.j=j;actual.dataset.field='actual';actual.setAttribute('aria-label',`${name} set ${j+1} repetitions, time or distance`);line.append(lab,check,weight,actual);sets.append(line);const prev=priorSet(name,j);if(prev){const note=document.createElement('div');note.className='prior';note.textContent='Previous ('+prev.date+'): '+(prev.weight?prev.weight+' lb · ':'')+(prev.actual||'')+(target.includes('minute')?' min':target.includes('feet')?' ft':target.includes('seconds')?' sec':' reps');sets.append(note)}}wrap.append(head,sub,sets);$('exercises').append(wrap)});$('notes').value=saved.notes||'';$('status').textContent='';renderHistory()};function collect(){return {date:$('date').value,day:current,notes:$('notes').value,warmup:warmups.map((_,i)=>document.querySelector('[data-warm-check="'+i+'"]').checked),core:cores.map((_,i)=>({done:document.querySelector('[data-core-check="'+i+'"]').checked,actual:document.querySelector('[data-core-actual="'+i+'"]').value})),cardio:{done:$('cardioDone').checked,...Object.fromEntries(Array.from(document.querySelectorAll('[data-cardio]')).map(x=>[x.dataset.cardio,x.value]))},updated:new Date().toISOString(),entries:workouts[current].items.map(([name,target],i)=>({sets:Array.from({length:setCount(target)},(_,j)=>({done:document.querySelector(`.set-done[data-i="${i}"][data-j="${j}"]`).checked,weight:document.querySelector(`[data-field="weight"][data-i="${i}"][data-j="${j}"]`).value,actual:document.querySelector(`[data-field="actual"][data-i="${i}"][data-j="${j}"]`).value}))}))}}function save(){if(!$('date').value){$('status').textContent='Choose a date first.';return}db[recordKey()]=collect();try{localStorage.setItem(key,JSON.stringify(db));$('status').textContent='Saved on this device.';renderHistory()}catch(e){$('status').textContent='Unable to save. Check browser storage settings.'}}function renderHistory(){let records=Object.values(db).sort((a,b)=>b.date.localeCompare(a.date)||b.day-a.day);$('history').replaceChildren();if(!records.length){$('history').textContent='No workouts saved yet.';return}records.slice(0,30).forEach(r=>{let el=document.createElement('div');el.className='history-item';let completed=(r.entries||[]).reduce((n,e)=>n+(e.sets||[]).filter(x=>x.done).length,0),total=workouts[r.day].items.reduce((n,[,t])=>n+setCount(t),0);el.textContent=`${r.date} · Day ${r.day+1} · ${completed}/${total} sets completed${r.cardio?.done?' · cardio ✓':''} · warm-up ${(r.warmup||[]).filter(Boolean).length}/9 · core ${(r.core||[]).filter(x=>x.done).length}/6`;let open=document.createElement('button');open.className='action secondary';open.style='padding:6px 10px;margin-left:10px';open.textContent='Open';open.onclick=()=>{current=r.day;$('date').value=r.date;render();window.scrollTo(0,0)};el.append(open);$('history').append(el)})}$('days').onclick=e=>{const b=e.target.closest('button[data-day]');if(b){current=Number(b.dataset.day);render()}};$('date').onchange=render;$('save').onclick=save;$('clear').onclick=()=>{if(confirm('Clear the saved workout for this date and day?')){delete db[recordKey()];localStorage.setItem(key,JSON.stringify(db));render()}};$('export').onclick=()=>{let rows=[['Date','Day','Exercise','Target','Set','Completed','Weight (lb)','Reps / Time / Distance','Notes','Cardio machine','Cardio complete','Cardio minutes','Cardio metric 1','Cardio metric 2','Cardio metric 3','Warm-up completed','Core completed','Core results']];Object.values(db).sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>workouts[r.day].items.forEach(([name,target],i)=>{let e=(r.entries||[])[i]||{};(e.sets||[]).forEach((v,j)=>rows.push([r.date,r.day+1,name,target,j+1,v.done?'Yes':'No',v.weight||'',v.actual||'',r.notes||'',cardioPlan[r.day].machine,r.cardio?.done?'Yes':'No',r.cardio?.minutes||'',r.cardio?.field0||'',r.cardio?.field1||'',r.cardio?.field2||'',(r.warmup||[]).filter(Boolean).length+'/9',(r.core||[]).filter(x=>x.done).length+'/6',(r.core||[]).map((x,i)=>cores[i][0]+': '+(x.actual||'')).join('; ')]))}));let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='2fit-cardio-and-individual-sets.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();</script></body></html>
